# conda alternative to requirements.txt
#   conda env create -f environment.yml
#   conda activate mat-imbalance
name: mat-imbalance
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24,<2.1
  - pandas>=2.0
  - scipy>=1.11
  - matplotlib>=3.7
  - scikit-learn>=1.3
  - imbalanced-learn>=0.11
  - py-xgboost>=2.0
  - pymatgen>=2023.9.10
  - statsmodels>=0.14
  - requests>=2.31
  - pip
  - pip:
      - matminer>=0.9.0
      - shap>=0.44
